# ─────────────────────────────────────────────────────────────
# SkyBot v2 — Railway Nixpacks Config
# ─────────────────────────────────────────────────────────────
# Key change from v1: NO Python venv, NO edge-tts binary.
# All TTS is done via pure HTTP (Google TTS / StreamElements / VoiceRSS)
# and encoded to opus using @discordjs/voice's built-in prism-media
# (FFmpeg transcoder). This removes the #1 cause of Railway TTS failures.
# ─────────────────────────────────────────────────────────────

[phases.setup]
nixPkgs = ["nodejs_20", "ffmpeg-headless", "yt-dlp", "python3", "gcc", "gnumake"]

[variables]
NODE_ENV = "production"

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["echo 'No build step needed for SkyBot v2'"]

[start]
cmd = "node src/index.js"
