# ─────────────────────────────────────────────────────────────
# SkyBot v2 — Railway Nixpacks Config
# ─────────────────────────────────────────────────────────────
# Packages installed:
#   - nodejs_20       : runtime
#   - ffmpeg-headless : TTS + music audio transcoding
#   - yt-dlp          : /music + /download (YouTube, TikTok, etc.)
#   - python3         : needed by node-gyp to compile @discordjs/opus
#                       (native opus encoder for Discord voice)
#   - gcc             : C compiler for native module compilation
#   - make            : build tool for native modules
# ─────────────────────────────────────────────────────────────

# SkyBot v2 — Railway Nixpacks Config

[phases.setup]
nixPkgs = ["nodejs_20", "ffmpeg-headless", "yt-dlp", "python3", "gcc", "gnumake"]

[variables]
NODE_ENV = "production"

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["echo 'No build step needed for SkyBot v2'"]

[start]
cmd = "node src/index.js"
